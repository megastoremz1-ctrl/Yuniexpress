<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none">
  <!-- White background -->
  <rect width="280" height="120" rx="8" fill="white"/>
  <!-- Orange mobile phone body -->
  <rect x="40" y="12" width="36" height="58" rx="6" fill="#F37021"/>
  <!-- Phone screen (white) -->
  <rect x="44" y="18" width="28" height="38" rx="3" fill="white"/>
  <!-- Keypad grid inside phone -->
  <rect x="48" y="44" width="5" height="5" rx="1" fill="#F37021"/>
  <rect x="56" y="44" width="5" height="5" rx="1" fill="#F37021"/>
  <rect x="64" y="44" width="5" height="5" rx="1" fill="#F37021"/>
  <rect x="48" y="52" width="5" height="5" rx="1" fill="#F37021"/>
  <rect x="56" y="52" width="5" height="5" rx="1" fill="#F37021"/>
  <rect x="64" y="52" width="5" height="5" rx="1" fill="#F37021"/>
  <!-- Signal waves above phone (orange) -->
  <path d="M64 14 C67 11, 71 11, 74 14" stroke="#F37021" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M61 9 C66 4, 73 4, 78 9" stroke="#F37021" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Dollar/money circle coming out of phone -->
  <circle cx="74" cy="28" r="10" fill="#F37021"/>
  <text x="70" y="33" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">$</text>
  <!-- Card/money shape behind -->
  <rect x="66" y="34" width="18" height="12" rx="2" fill="#F37021" opacity="0.6" transform="rotate(-15 75 40)"/>
  <!-- e-Mola text (orange, bold) -->
  <text x="92" y="58" font-family="'Arial Black', Arial, sans-serif" font-size="32" font-weight="900" fill="#F37021">e-Mola</text>
  <!-- Tagline -->
  <text x="92" y="78" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#F37021">Meu cell, minha mola</text>
</svg>
