<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- White background -->
  <rect width="240" height="80" rx="8" fill="white"/>
  <!-- Orange mobile phone -->
  <rect x="22" y="10" width="24" height="40" rx="4" fill="#F97316" stroke="#F97316" stroke-width="1"/>
  <!-- Phone screen -->
  <rect x="25" y="14" width="18" height="28" rx="2" fill="white"/>
  <!-- Keypad dots on screen -->
  <rect x="27" y="30" width="3" height="3" rx="0.5" fill="#F97316"/>
  <rect x="32" y="30" width="3" height="3" rx="0.5" fill="#F97316"/>
  <rect x="37" y="30" width="3" height="3" rx="0.5" fill="#F97316"/>
  <rect x="27" y="35" width="3" height="3" rx="0.5" fill="#F97316"/>
  <rect x="32" y="35" width="3" height="3" rx="0.5" fill="#F97316"/>
  <rect x="37" y="35" width="3" height="3" rx="0.5" fill="#F97316"/>
  <!-- Signal waves on top -->
  <path d="M38 12C40 10 42 10 44 12" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M36 9C40 5 44 5 48 9" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Money/dollar coming out -->
  <circle cx="44" cy="20" r="7" fill="#F97316" stroke="white" stroke-width="1.5"/>
  <text x="41" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white">$</text>
  <!-- e-Mola text -->
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#F97316">e-Mola</text>
  <!-- Tagline -->
  <text x="58" y="58" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#F97316">Meu cell, minha mola</text>
</svg>
