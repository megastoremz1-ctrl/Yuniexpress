<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- White background -->
  <rect width="340" height="100" rx="8" fill="white"/>
  <!-- Vodafone red circle -->
  <circle cx="50" cy="50" r="28" fill="#E60000"/>
  <!-- White speech mark/apostrophe inside - Vodafone SIM shape -->
  <path d="M42 38 C42 34, 46 32, 50 32 C54 32, 58 36, 58 40 C58 44, 55 47, 52 48 L50 56 C50 56, 48 56, 48 56 L46 48 C43 47, 42 44, 42 40 Z" fill="white"/>
  <!-- Vertical divider -->
  <line x1="92" y1="22" x2="92" y2="78" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- M-Pesa phone icon (red outline) -->
  <rect x="106" y="26" width="24" height="44" rx="4" fill="none" stroke="#E60000" stroke-width="2.5"/>
  <!-- Phone screen -->
  <rect x="109" y="32" width="18" height="28" rx="2" fill="#E60000" opacity="0.1"/>
  <!-- Green money/leaf coming from phone -->
  <path d="M126 36 L138 30 L136 38 L144 32 L134 46 L136 40 L128 44 Z" fill="#4CAF50"/>
  <!-- m-pesa text in red -->
  <text x="154" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#E60000">m-pesa</text>
</svg>
